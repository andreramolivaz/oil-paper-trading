name: research data (manual)

# Downloads the per-contract and ETF bars the scheduled jobs do not archive and uploads them as an artifact.
# Nothing is written to the data branch: this is a research tool, not part of the trading loop.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "all (default), satellites (the daily tables of the other markets only), kalshi (the prediction market's catalogue), kalshi-trades (the markets the desk reads and a week of their trades) or kalshi-history (the daily candlesticks of the event series since January 2026)"
        required: false
        default: "all"
      series:
        description: "kalshi-history only: a comma-separated list of series tickers instead of the desk's own (phase 15 research)"
        required: false
        default: ""
      since:
        description: "kalshi-history only: the first day (ISO date)"
        required: false
        default: "2026-01-01"
  push:
    branches: ["research-fetch"]

permissions:
  contents: read

concurrency:
  group: research-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Fetch
        run: .venv/bin/python scripts/research_fetch.py --out out/research --only "${{ inputs.only || 'all' }}" --series "${{ inputs.series || '' }}" --since "${{ inputs.since || '2026-01-01' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: research-data
          path: out/research
          retention-days: 14
