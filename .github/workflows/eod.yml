name: eod (manual re-run of one London date)

# The end of day is no longer on a schedule: GitHub fired these crons four to six hours late, after midnight in
# London, and two days out of three the job found "today" not settled yet and did nothing. The runner's tick
# (runner.yml) now runs the end of day by itself as soon as a settled London date has none. This workflow is
# kept for re-running one date by hand. ICE Brent settles 19:28-19:30 London.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "London trading date to process (YYYY-MM-DD); default = today"
        required: false
      force:
        description: "Run even if the guard says it is not time yet"
        type: boolean
        default: false

concurrency:
  group: trading-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPT_STATE_DIR: ${{ github.workspace }}/state-repo/state
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Checkout data branch
        run: scripts/data_branch.sh checkout state-repo
      - name: End of day (idempotent per London date)
        run: >
          .venv/bin/python -m engine.cli eod --job-id "${{ github.run_id }}"
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.force && '--force' || '' }}
      # A failed export must not keep the state from being pushed: the next tick rebuilds the site data.
      - name: Export site data
        run: >
          .venv/bin/python -m engine.cli export-site --out state-repo/site-data
          || echo "::warning::site export failed: the state is pushed anyway"
      - name: Push state
        run: scripts/data_branch.sh push state-repo "eod $(date -u +%Y-%m-%d) run ${{ github.run_id }}"
      - name: Alerts
        run: .venv/bin/python -m engine.cli alerts --repo "${{ github.repository }}" || true
