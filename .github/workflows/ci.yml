name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Type check
        run: .venv/bin/mypy engine
      - name: Unit tests (offline)
        run: .venv/bin/pytest -q -m "not network" --maxfail=5
      # Real sources go down; that must not break CI. But the step must still SHOW when they do, so no `|| true`:
      # continue-on-error already keeps the job green while marking the step.
      - name: Network smoke tests (non-blocking)
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: .venv/bin/pytest -q -m network --maxfail=20

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck --if-present && npm run build
        working-directory: site

  # Guard: the engine must build the dashboard JSON even with no state at all, and the site must build from it.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPT_OFFLINE: "1"
      OPT_STATE_DIR: ${{ github.workspace }}/state-empty
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Export the dashboard JSON from an empty state
        run: |
          .venv/bin/python -m engine.cli export-site --out site-data-empty
          test -f site-data-empty/summary.json
          .venv/bin/python - <<'PY'
          import json, math, pathlib
          # strict JSON only: NaN or Infinity would break JSON.parse in the browser
          for path in sorted(pathlib.Path("site-data-empty").glob("*.json")):
              text = path.read_text()
              assert "NaN" not in text and "Infinity" not in text, f"{path} contiene NaN/Infinity"
              json.loads(text)
          print("ok:", len(list(pathlib.Path('site-data-empty').glob('*.json'))), "file JSON validi")
          PY
