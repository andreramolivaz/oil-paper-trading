[project]
name = "oil-paper-trading"
version = "0.1.0"
description = "Brent crude research and paper-trading engine (GitHub Actions + static dashboard)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pandas>=3.0,<4",
  "numpy>=2.3,<3",
  "scipy>=1.14",
  "statsmodels>=0.14.4",
  "arch>=7.0",
  "scikit-learn>=1.6",
  "lightgbm>=4.5",
  "hmmlearn>=0.3.3",
  "shap>=0.46",
  "pyyaml>=6.0",
  "requests>=2.32",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
  "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "site", "state", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RUF012", "B905", "SIM108", "PLW2901", "RUF001", "RUF002", "RUF003", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "T20", "RUF"]
"scripts/*" = ["T20"]
"engine/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that hit real external sources (opt-in: pytest -m network)",
  "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
