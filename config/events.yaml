  - {id: fomc_2026_12, name: "FOMC", date: 2026-12-09, time: "14:00", tz: America/New_York, binary: true, confirmed: true}
  - {id: opec_momr_2026_10, name: "OPEC Monthly Oil Market Report", date: 2026-10-13, time: "12:30", tz: Europe/Vienna, binary: false, confirmed: false}
  - {id: iea_omr_2026_10, name: "IEA Oil Market Report", date: 2026-10-14, time: "10:00", tz: Europe/Paris, binary: false, confirmed: false}
