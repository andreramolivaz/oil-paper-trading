# Scheduled event calendar (brief §6). Dates verified where possible; `confirmed: false` = provisional.
# Times are local to the stated timezone. The engine computes "hours to next binary event" from this file
# plus rule-based recurring events (EIA WPSR Wednesdays 10:30 ET, COT Fridays, ICE Brent expiries).
recurring:
  - {id: eia_wpsr, name: "EIA Weekly Petroleum Status Report", rule: weekly, weekday: 2, time: "10:30", tz: America/New_York, binary: true, shift_after_us_holiday: true}
  - {id: cot, name: "COT CFTC/ICE", rule: weekly, weekday: 4, time: "15:30", tz: America/New_York, binary: false}
  - {id: baker_hughes, name: "Baker Hughes rig count", rule: weekly, weekday: 4, time: "13:00", tz: America/New_York, binary: false}
  - {id: ice_brent_expiry, name: "Scadenza ICE Brent", rule: ice_brent_expiry, time: "19:30", tz: Europe/London, binary: false}
  - {id: eia_steo, name: "EIA STEO", rule: monthly_first_tuesday_after_first_thursday, time: "12:00", tz: America/New_York, binary: false}
  - {id: hurricane_season, name: "Stagione uragani Atlantico", rule: season, start: "06-01", end: "11-30", binary: false}
oneoff:
