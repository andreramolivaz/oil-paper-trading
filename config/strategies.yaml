# Strategy universe (docs/STRATEGIES.md). Schema per entry:
#   id: S1            unique id used everywhere (signals, shadow accounts, dashboard)
#   class: dotted path to the Strategy subclass
#   enabled: true     if false the strategy is not instantiated at all
#   lifecycle: research | incubation | active | retired   (incubation/research = shadow account only, weight 0 in master)
#   params: {...}     overrides of Strategy.default_params()
# Lifecycle is promoted/demoted ONLY by the validation report (phase 6) — never by hand without a note here.
strategies:
  - {id: S1,  class: engine.strategies.s01_momentum.S1MomentumCarry,            enabled: true, lifecycle: incubation, params: {}}
