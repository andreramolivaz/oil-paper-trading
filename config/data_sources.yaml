# Verified 2026-10-05 (docs/DATA_SOURCES.md). Order within a block = fallback order.
prices:
  brent_spot:
    - {adapter: eia, series: RBRTE, needs_key: true}
    - {adapter: eia_xls, url: "https://www.eia.gov/dnav/pet/hist_xls/RBRTEd.xls"}
    - {adapter: fred, series: DCOILBRENTEU, needs_key: true}
    - {adapter: fred_csv, series: DCOILBRENTEU}
  wti_spot:
    - {adapter: eia, series: RWTC, needs_key: true}
    - {adapter: fred, series: DCOILWTICO, needs_key: true}
    - {adapter: fred_csv, series: DCOILWTICO}
  brent_front:
    - {adapter: yahoo, symbol: "BZ=F"}
  wti_front:
    - {adapter: yahoo, symbol: "CL=F"}
  rbob_front:
    - {adapter: yahoo, symbol: "RB=F"}
  ho_front:
    - {adapter: yahoo, symbol: "HO=F"}
  brent_curve:
    - {adapter: yahoo_curve, root: BZ, months: 36}
  wti_curve:
    - {adapter: yahoo_curve, root: CL, months: 12}
  wti_curve_hist:
    - {adapter: eia, series: [RCLC1, RCLC2, RCLC3, RCLC4], needs_key: true, note: "ended 2024-04-05"}
volatility_macro:
  ovx:
    - {adapter: fred, series: OVXCLS, needs_key: true}
    - {adapter: yahoo, symbol: "^OVX"}
    - {adapter: fred_csv, series: OVXCLS}
  vix:
    - {adapter: fred, series: VIXCLS, needs_key: true}
    - {adapter: yahoo, symbol: "^VIX"}
  dxy:
    - {adapter: fred, series: DTWEXBGS, needs_key: true}
    - {adapter: yahoo, symbol: "DX-Y.NYB"}
  spx:
    - {adapter: yahoo, symbol: "^GSPC"}
  copper:
    - {adapter: yahoo, symbol: "HG=F"}
  us10y:
    - {adapter: fred, series: DGS10, needs_key: true}
    - {adapter: fred_csv, series: DGS10}
  breakeven10y:
    - {adapter: fred, series: T10YIE, needs_key: true}
    - {adapter: fred_csv, series: T10YIE}
fundamentals:
  wpsr:
    - {adapter: eia_wpsr, needs_key: true}
    - {adapter: eia_wpsr_csv, url: "https://ir.eia.gov/wpsr/table1.csv"}
  steo_brent:
    - {adapter: eia_steo, series: BREPUUS, needs_key: true}
  rig_count:
    - {adapter: baker_hughes, url: "https://rigcount.bakerhughes.com/na-rig-count"}

positioning:
  cot_wti:
    - {adapter: cftc_socrata, market_code: "067651"}
    - {adapter: cftc_file, url: "https://www.cftc.gov/dea/newcot/f_disagg.txt"}
  cot_brent:
    - {adapter: ice_cot, market: "ICE Brent Crude Futures - ICE Futures Europe", first_year: 2011}
  cot_gasoil:
    - {adapter: ice_cot, market: "ICE Gasoil Futures - ICE Futures Europe", first_year: 2011}
news:
  gdelt_events:
    - {adapter: gdelt_files, base: "https://data.gdeltproject.org/gdeltv2/"}
    - {adapter: gdelt_doc_api, min_interval_seconds: 6}
  gpr:
    - {adapter: gpr, url: "https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls"}

# ---------------------------------------------------------------------------------------------------------
# The desk (engine/desk): series with no roll jump in them. Verified 2026-10-08 on a GitHub runner.
# ---------------------------------------------------------------------------------------------------------
desk:
  bno_daily:
    - {adapter: yahoo, symbol: "BNO"}
  uso_daily:
    - {adapter: yahoo, symbol: "USO"}
  # One long table per root with the full daily history of every listed contract. BZ=F and CL=F are not a
  # contract: near an expiry Yahoo interleaves two of them inside the same bar. These tables are cumulative
  # (engine/data/fetch.py merges each download with the archive), because Yahoo forgets a contract at expiry.
  cl_contracts:
    - {adapter: yahoo_contracts, root: CL, months: 14, far_decembers: 3}
  bz_contracts:
    - {adapter: yahoo_contracts, root: BZ, months: 14, far_decembers: 3}
  # Tanker transits through the Strait of Hormuz and Bab el-Mandeb, from AIS positions (IMF PortWatch).
  # Weekly publication, a week at a time: context and a risk input, never a trading signal on its own.
  hormuz:
    - {adapter: portwatch, chokepoint: "Strait of Hormuz"}
  bab_el_mandeb:
    - {adapter: portwatch, chokepoint: "Bab el-Mandeb Strait"}

# Refreshed on every tick: what the paper brokers fill and mark against.
desk_intraday:
  bno_intraday:
    - {adapter: yahoo_intraday, symbol: "BNO", interval: "30m", lookback_days: 10}
  cl_intraday:
    - {adapter: yahoo_intraday_contracts, root: CL, contracts: 2, interval: "30m", lookback_days: 10}
  # No book trades this one (ICE Brent futures are not on Robinhood): it is the Brent price the terminal shows.
  bz_intraday:
    - {adapter: yahoo_intraday_contracts, root: BZ, contracts: 2, interval: "30m", lookback_days: 5}

# Real option chains with bid and ask (Cboe delayed quotes, 15 minutes, no key).
options:
  bno_options:
    - {adapter: cboe_chain, symbol: "BNO"}
  uso_options:
    - {adapter: cboe_chain, symbol: "USO"}

# Refreshed by the weekly job only: the free Alpha Vantage tier allows 25 calls a day and this table needs 12.
weekly_alt:
  # SEC Form 4 insider transactions for the oil complex, via Alpha Vantage. Public, legally disclosed filings.
  # published_at is INFERRED from the two-business-day statutory deadline (17 CFR 240.16a-3), never observed,
  # so the series is always approx. The key is optional like EIA/FRED: without it the source goes yellow, the
  # insider features stay NaN and S21 returns None. Weekly cadence — the flow is ~9 open-market purchases per
  # name per year, and the free Alpha Vantage tier allows 25 calls a day against a 12-name universe.
  insider_form4:
    - {adapter: alphavantage_insider, needs_key: true, approx: true, cadence: weekly,
       url: "https://www.alphavantage.co/query?function=INSIDER_TRANSACTIONS"}

# Only these can turn the overall status red and stop new risk. Everything else degrades the features that
# read it and nothing more.
critical_sources: [brent_front, wti_front, bno_daily]
