# The desk's paper books (engine/desk). Each book starts from account.initial_capital in config/risk.yaml.
#
# The three linear books read the SAME forecast and differ only in how much of it they buy and in whether they
# may be short. The forecast is seven sleeves from three sources that weigh a third each (engine/desk/signals.py):
# the price of crude (trend, acceleration, skew), the futures curve (carry, carry-momentum) and other markets
# (copper and the dollar). The volatility targets are Kelly fractions of an assumed Sharpe ratio of 0.5: the
# growth-optimal volatility is then 50 % a year, half of it 25 %, a quarter 12 %. The seven sleeves measured
# 0.5-0.7 on real data (docs/RESEARCH.md); the targets were NOT raised with them, because part of that gain is
# selection and a book sized on a Sharpe it does not have loses more than one sized on a Sharpe it exceeds.
# Running above 50 % does not raise the expected growth, it lowers it and raises the chance of ruin.
#
#   vol_target            annualised volatility the book aims for when the forecast is at its normal size (10)
#   max_leverage          ceiling on the oil exposure / equity; never above the hard 10x enforced by the broker
#   weekend_max_leverage  lower ceiling applied at the last decision before a closure of more than one day
#   long_only             the book is never short: a negative forecast means cash
#   short_via             fund books only: the inverse fund the book BUYS, with cash, when its forecast is short
#                         (SCO: -2x the daily return of WTI, so half the dollars carry the same exposure). A fund
#                         book without it cannot be short: the account it imitates does not borrow shares.
#   buffer                no trade while the target is within this fraction of a normal-size position
#   daily_loss_breaker    loss on the day, as a fraction of the day's opening equity, that flattens the book
#   forecast              which forecast the book reads: "desk" (default: the seven sleeves, replayed in the
#                         backtest) or "kalshi" (the de-escalation index read on the prediction markets' archive,
#                         engine/desk/oracle.py: one sleeve, no history, no backtest, candidate only)
books:
  - id: prudente
    name: Prudent
    vehicle: BNO
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the Brent fund, never levered and never short. It is the book one could keep in an
      account without margin: it buys BNO when the forecast is long and stays in cash otherwise.

  - id: dinamico
    name: Dynamic
    vehicle: BNO
    vol_target: 0.25
    max_leverage: 2.0
    weekend_max_leverage: 1.5
    long_only: false
    short_via: SCO
    daily_loss_breaker: 0.08
    description: >-
      Half Kelly on the Brent fund, long and short. Long: BNO up to 2x on margin (the most Regulation T allows
      overnight). Short: it buys SCO, the fund that returns -2 times WTI each day, with cash and never beyond
      100% of the account. The same forecast as the prudent book, twice the risk, and the short side too.

  - id: spinto
    name: Aggressive
    vehicle: MCL
    vol_target: 0.50
    max_leverage: 10.0
    weekend_max_leverage: 3.0
    long_only: false
    daily_loss_breaker: 0.15
    description: >-
      Full Kelly on the micro WTI future, long and short, up to 10x. The leverage is not chosen: it comes out of
      the ratio between the volatility target and the volatility of the moment. With crude at 50% volatility it
      stays between 1x and 2x; it takes calm markets and a strong forecast to see it rise. It can wipe out the
      account.

  # ---- the satellite markets (phase 12, docs/RESEARCH.md chapter 8) --------------------------------------------
  # Candidate books: paper books beside the four core ones, judged on real fills before anybody trusts them.
  # Same rules as the prudente book, the price source of the forecast alone (trend, acceleration, skew computed
  # on the fund's own history), no curve, no copper and no dollar. Why these markets: the weather moves
  # agriculture (and natural gas, which was tried through its funds and failed the declared filter: a negative
  # Sharpe after costs on eighteen years, docs/RESEARCH.md chapter 8), geopolitics moves gold, the electricity
  # demand of AI moves copper - bets that are not the crude bet the core books already hold.
  - id: gold
    name: Gold
    role: candidate
    vehicle: GLD
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the gold fund, never levered and never short: the prudent book's rules, the forecast
      read on the price of gold itself. The market of geopolitics.

  - id: copper
    name: Copper
    role: candidate
    vehicle: CPER
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the copper fund, never levered and never short: the prudent book's rules, the
      forecast read on the price of copper itself. The market of electrification and data centres.

  - id: agri
    name: Agriculture
    role: candidate
    vehicle: DBA
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the agriculture fund (corn, soybeans, wheat, sugar, coffee, cocoa, livestock), never
      levered and never short: the prudent book's rules on the market the weather moves most.

  # Phase 13 (13 October 2026): bonds, equities and the owner's themes - the electricity for the data centres,
  # electrification, the AI investment and its bubble, the energy transition - each measured once before it
  # started (docs/RESEARCH.md, chapter 9: 0.37, 0.58, 0.35, 0.43, 0.67, 0.47, 0.75 after costs). Same rules.
  - id: bonds
    name: Treasuries
    role: candidate
    vehicle: TLT
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on long Treasuries, never levered and never short: the market that pays when growth
      and inflation fall. Coupons credited on the ex-date.

  - id: equities
    name: Equities
    role: candidate
    vehicle: SPY
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the S&P 500, never levered and never short: a way of being in equities that steps
      aside in the declines, not a signal that anticipates them.

  - id: uranium
    name: Uranium
    role: candidate
    vehicle: URA
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the uranium fund, never levered and never short: the nuclear leg of the electricity
      the data centres need.

  - id: utilities
    name: Utilities
    role: candidate
    vehicle: XLU
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on US utilities, never levered and never short: the grid that carries the new
      electricity demand; moves with interest rates.

  - id: lithium
    name: Lithium
    role: candidate
    vehicle: LIT
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the lithium and battery fund, never levered and never short: electrification, a
      boom-and-bust market the trend rule rides and leaves.

  - id: semis
    name: Semiconductors
    role: candidate
    vehicle: SMH
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on semiconductors, never levered and never short: the AI investment itself. Shares
      two thirds of its moves with the S&P 500, so it counts for less than a separate market.

  - id: clean
    name: Clean energy
    role: candidate
    vehicle: ICLN
    vol_target: 0.12
    max_leverage: 1.0
    long_only: true
    sleeves: {trend: 1.0, accel: 1.0, skew: 1.0}
    daily_loss_breaker: 0.05
    description: >-
      A quarter of Kelly on the clean energy fund (solar, wind, hydrogen), never levered and never short: the
      energy transition, which boomed in 2020 and bust after; the trend rule earned the boom and sat out the bust.

  # Phase 14 (15 October 2026), on the owner's request for "a highly speculative, leveraged strategy based on
  # Kalshi" (docs/RESEARCH.md, chapter 10, written before the first decision). A Kalshi contract cannot be
  # bought on margin, so the leverage is on oil: the micro WTI future, long and short, at the highest
  # volatility target the hard rules allow, and Kalshi gives the direction - the week's change in the crowd's
  # probability that the war de-escalates (the strait back to normal, a US-Iran meeting, a nuclear deal, within
  # 90 days): rising, short oil; falling, long. There is no history of these markets, so there is no backtest:
  # the book is judged on its live fills only, is never promoted, and the prior written with the rule is that
  # it has no edge. It can wipe out its account.
  - id: oracle
    name: Oracle
    role: candidate
    forecast: kalshi
    vehicle: MCL
    vol_target: 0.50
    max_leverage: 10.0
    weekend_max_leverage: 3.0
    long_only: false
    daily_loss_breaker: 0.15
    description: >-
      Speculative, paper only, no backtest. Full Kelly on the micro WTI future, long and short, up to 10x, in the
      direction Kalshi's prediction markets point: when the crowd's probability of de-escalation (the strait
      back to normal, a US-Iran meeting, a nuclear deal within 90 days) rises over a week the book is short oil,
      when it falls the book is long. The rule was written down before the first decision and is judged on live
      fills alone; the prior is that it has no edge. It can wipe out the account.

  # Phase 15 (15 October 2026), on the owner's "improve on the other markets, and speculative Kalshi as the
  # reference" (docs/RESEARCH.md, chapter 11, registered before any measurement). The same pattern on the funds
  # the desk already holds: a Kalshi index gives the direction, the fund the leverage (2x, the margin Robinhood
  # gives on a fund), long only. Two indices beside the de-escalation one: the Fed path (the expected change of
  # the target rate over the FOMC meetings within 90 days, read off each meeting's outcome markets; the week's
  # change turning dovish is a positive sleeve) and the recession probability (the yearly NBER markets as one
  # ladder, within 365 days; the odds rising is a positive sleeve). A book reads its sleeves with a sign and
  # averages them. Four books were registered and measured once on the archive (chapter 11 E): bonds (TLT) and
  # gold (GLD) measured a negative after-cost Sharpe and do not start, by the declared filter; equities and
  # utilities start. No backtest in the replay, never promoted, judged on live fills only; the prior is no edge.
  - id: oracle_equities
    name: Oracle equities
    role: candidate
    forecast: kalshi
    sleeves: {fedpath: 1.0, recession: -1.0}
    vehicle: SPY
    vol_target: 0.50
    max_leverage: 2.0
    weekend_max_leverage: 1.0
    long_only: true
    daily_loss_breaker: 0.15
    description: >-
      Speculative, paper only, no backtest. Full Kelly on the S&P 500 fund, long only, up to 2x on margin, in the
      direction Kalshi's prediction markets point: long when the crowd's Fed path turns dovish over a week
      (Bernanke and Kuttner: a surprise cut lifts equities) or its odds of a recession within a year fall, in
      cash otherwise. The rule was written down before it was measured (Sharpe 1.6, standard error 1.7, on nine
      months of archive); the prior is that it has no edge.

  - id: oracle_utilities
    name: Oracle utilities
    role: candidate
    forecast: kalshi
    sleeves: {fedpath: 1.0}
    vehicle: XLU
    vol_target: 0.50
    max_leverage: 2.0
    weekend_max_leverage: 1.0
    long_only: true
    daily_loss_breaker: 0.15
    description: >-
      Speculative, paper only, no backtest. Full Kelly on the utilities fund, long only, up to 2x on margin, long
      when the crowd's Fed path on Kalshi turns dovish over a week (utilities as bond proxies: a rule of thumb),
      in cash otherwise. The rule was written down before it was measured (Sharpe 1.7, standard error 2.7, on
      four months of archive); the prior is that it has no edge.

# The options book (engine/desk/options.py): put credit spreads sold below the market when the forecast is
# long, priced on the real delayed bid and ask. Its replay is a model and is labelled approx everywhere; the
# book exists to measure the idea on real quotes. Every number here is a rule of the book, not a fitted value:
# the threshold is the same "half a normal conviction" the research used before any result was seen, the
# delta is the middle of the usual 15-30 range, and the wing is as wide as the risk budget allows.
options_book:
  enabled: true
  id: opzioni
  name: Options
  forecast_threshold: 5.0        # combined forecast needed to sell a put spread
  short_delta: 0.20              # delta of the put sold
  dte_min: 21                    # days to expiry: listed expiry closest to dte_target inside [dte_min, dte_max]
  dte_target: 30
  dte_max: 45
  risk_per_structure: 0.05       # maximum loss of one structure as a fraction of equity
  max_open: 2                    # structures open at the same time (so at most 10 % of equity at risk)
  min_business_days_between_entries: 10
  min_width_pct: 0.03            # a wing narrower than this fraction of the price is not worth its cost
  min_credit_to_width: 0.10
  max_leg_spread: 0.25           # a leg quoted wider than this fraction of its mid-price is not tradeable
  max_quote_age_minutes: 45      # the feed is 15 minutes late by itself
  fill_fraction: 0.25            # sells fill at bid + 25 % of the spread, buys at ask - 25 %
  fee_per_contract: 0.05         # regulatory and clearing fees; Robinhood charges no commission on options
  decision_time_ny: [15, 0]
  underlyings:
    - {symbol: USO, chain: uso_options, daily: uso_daily, forecast: MCL, label: "WTI fund"}
    - {symbol: BNO, chain: bno_options, daily: bno_daily, forecast: BNO, label: "Brent fund"}
  description: >-
    Put credit spreads on USO (and on BNO when the quotes allow it), sold below the market when the forecast is
    long. Maximum loss defined at the opening: 5% of the account per structure, two structures at most.
    Experimental: the simulation is a model, the book exists to measure it on real prices.
